<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TCG Price Checker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <div class="eyebrow">MULTI-STORE PRICE SEARCH</div>
        <h1>TCG Price Checker</h1>
      </div>
      <span class="version">V2</span>
    </header>

    <form id="search-form">
      <label for="game">Trading card game</label>
      <select id="game">
        <option value="any">Auto / Any TCG</option>
        <option value="gundam">Gundam Card Game</option>
        <option value="pokemon">Pokémon</option>
        <option value="onepiece">One Piece Card Game</option>
        <option value="magic">Magic: The Gathering</option>
      </select>

      <label for="card-number">Card number or product code</label>
      <div class="search-row">
        <input id="card-number" type="text" placeholder="e.g. GD06-066" maxlength="30" autocomplete="off">
        <button id="search-button" type="submit">Search</button>
      </div>
    </form>

    <div class="toolbar">
      <label class="toggle">
        <input type="checkbox" id="auto-toggle" checked>
        <span>Auto-compare product pages</span>
      </label>
    </div>

    <section id="status" class="status" aria-live="polite">
      Enter a card number to compare retailer listings.
    </section>

    <section id="results" class="results"></section>

    <footer>
      <span>Stores: KanZenGames · Untouchables</span>
      <span>Prices are retailer-listed; shipping/tax excluded.</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
