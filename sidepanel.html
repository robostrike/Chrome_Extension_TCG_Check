<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TCG Price Checker</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <div class="eyebrow">MULTI-STORE PRICE SEARCH</div>
        <h1>TCG Price Checker</h1>
      </div>
      <span class="version">V2</span>
    </header>

    <form id="search-form" class="search-panel">
      <label for="game">Trading card game</label>
      <select id="game">
        <option value="any">Auto / Any TCG</option>
        <option value="gundam">Gundam Card Game</option>
        <option value="pokemon">Pokémon</option>
        <option value="onepiece">One Piece Card Game</option>
        <option value="magic">Magic: The Gathering</option>
      </select>

      <label for="card-number">Card number or product code</label>
      <div class="search-row">
        <input id="card-number" type="text" placeholder="e.g. GD06-066" maxlength="30" autocomplete="off">
        <button id="search-button" type="submit">Search</button>
      </div>

      <label for="search-qty">Desired quantity</label>
      <input id="search-qty" type="number" min="1" value="1" step="1">
    </form>

    <div class="toolbar">
      <label class="toggle">
        <input type="checkbox" id="auto-toggle" checked>
        <span>Auto-compare product pages</span>
      </label>
    </div>

    <section class="buy-panel">
      <label for="buy-list">Buy list (one card per line, optional x quantity)</label>
      <textarea id="buy-list" placeholder="GD06-066 x2&#10;OP01-013&#10;MSB-070 x3"></textarea>
      <label for="default-qty">Default quantity for list items</label>
      <input id="default-qty" type="number" min="1" value="1" step="1">
      <label for="sort-mode">Sort checklist by</label>
      <select id="sort-mode">
        <option value="coverage">Most stock coverage</option>
        <option value="cheapest">Cheapest total</option>
      </select>
      <div class="buy-controls">
        <button id="buy-list-button" type="button" class="secondary">Check best stores</button>
        <button id="save-list-button" type="button" class="secondary">Save list</button>
        <button id="copy-order-button" type="button" class="secondary">Copy store order</button>
      </div>
      <div id="buy-status" class="status" aria-live="polite"></div>
      <div id="buy-results" class="buy-store-list"></div>
      <div id="per-card-results" class="buy-store-list"></div>
    </section>

    <section class="buy-panel history-panel">
      <div class="section-title">Saved buy list history</div>
      <div id="history-list" class="history-list"></div>
    </section>

    <section id="status" class="status" aria-live="polite">
      Enter a card number to compare retailer listings.
    </section>

    <section id="results" class="results"></section>

    <footer>
      <span>Stores: KanZenGames · Untouchables · GTA shops</span>
      <span>Open each listing to add it to cart manually.</span>
    </footer>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
